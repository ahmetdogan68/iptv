name: M3U Guncelle
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gereksinimleri yukle
        run: pip install -r requirements.txt
      - name: m3u olustur
        run: python converter.py
      - name: Kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add playlist.m3u
          git commit -m "guncellendi" || exit 0
          git push
