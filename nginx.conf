events {}
http {
    include /etc/nginx/mime.types;
    sendfile on;
    server {
        listen 0.0.0.0:8080;
        root /app/live;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        location / {
            autoindex on;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}
