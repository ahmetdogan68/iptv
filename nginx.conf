worker_processes 1;
error_log /app/logs/error.log;
pid /app/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /app/logs/access.log;
    sendfile on;
    server {
        listen 0.0.0.0:8080;
        root /app/live;
        add_header Access-Control-Allow-Origin * always;
        location / {
            autoindex on;
        }
        location ~ \.m3u8$ {
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
